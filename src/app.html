<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2f318b" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<script>
			// Set tema sebelum paint untuk menghindari kedip (flash of wrong theme).
			(function () {
				try {
					var t = localStorage.getItem('dtp:theme');
					if (!t) {
						t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
					}
					if (t === 'dark') document.documentElement.classList.add('dark');
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-background text-foreground antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
